name: Audit horse sprite PNGs

on:
  push:
    branches:
      - feat/horse-sprites-v4-integration
    paths:
      - "public/games/horse-racing/assets/horses/**/*.png"
      - "scripts/audit-horse-sprites.mjs"
      - ".github/workflows/audit-horse-sprites.yml"
  pull_request:
    paths:
      - "public/games/horse-racing/assets/horses/**/*.png"
      - "scripts/audit-horse-sprites.mjs"
      - ".github/workflows/audit-horse-sprites.yml"

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Audit all 40 horse frames
        run: node scripts/audit-horse-sprites.mjs
